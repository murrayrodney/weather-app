app = "integrated-awn-weather-api"
primary_region = "sjc"          # co-locate with Supabase (us-west-1); 06 section 4.1
kill_signal = "SIGTERM"
kill_timeout = "30s"

[deploy]
  strategy = "rolling"          # one machine: brief restart; bluegreen would briefly run two

[processes]
  api = "/usr/local/bin/api"

[env]
  APP_ENV = "production"
  AWN_MODE = "live"
  RUST_LOG = "info"
  SUPABASE_URL = "https://<project-ref>.supabase.co"
  SUPABASE_JWKS_URL = "https://<project-ref>.supabase.co/auth/v1/.well-known/jwks.json"

[http_service]
  processes = ["api"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"    # DECIDED Oct 7: allowed for api only (06 section 4.2)
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  processes = ["api"]
  size = "shared-cpu-1x"
  memory = "512mb"
