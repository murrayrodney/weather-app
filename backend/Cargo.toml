[workspace]
resolver = "2"
members = ["crates/*"]

# Test key generation (api JWT tests) is slow without optimisation.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

# Majors follow the guides (02 section 4.1): sqlx 0.8, reqwest 0.12, secrecy 0.10, tracing 0.1 / tracing-subscriber 0.3.
# Exact versions are pinned by the committed Cargo.lock (builds use --locked).
[workspace.dependencies]
# Later crates: `famweather-core = { workspace = true, features = [...] }` (poller adds "decrypt"; dev-deps add
# "test-support" / "testdb"; api never gets "decrypt").
famweather-core = { path = "crates/core" }
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
flate2 = "1"
futures = "0.3"
hex = "0.4"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# "migrate" + "macros": sqlx::migrate! (admin migrate, core::testdb) and #[sqlx::test].
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "signal"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

# 04 database + admin
anyhow = "1"
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
csv = "1"
# Exact version pinned (conventions: HPKE crate pin + known-answer test). Only the suite we use: X25519 / HKDF-SHA256 / AES-GCM.
hpke = { version = "=0.15.1", default-features = false, features = ["alloc", "getrandom", "x25519", "aes"] }
rpassword = "7"
toml = "1"

# 02 api
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "matched-path", "query", "tokio"] }
governor = "0.10"
jsonwebtoken = "11"
tower = { version = "0.5", default-features = false, features = ["limit", "load-shed", "util"] }
tower-http = { version = "0.7", default-features = false, features = ["catch-panic", "limit", "propagate-header", "request-id", "sensitive-headers", "set-header", "timeout", "trace"] }

# dev
assert_cmd = "2"
hmac = "0.13"
rand_core = { version = "0.10", default-features = false }
tempfile = "3"
wiremock = "0.6"
