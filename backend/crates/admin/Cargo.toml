[package]
name = "admin"
version.workspace = true
edition.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "admin"
path = "src/main.rs"

[features]
default = []
# Compose tests (04 section 11.5) and the single fault-injection flag `invite --test-fail-after-auth`.
compose-tests = []

[dependencies]
anyhow.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
clap.workspace = true
csv.workspace = true
# No `decrypt` here: the admin binary can encrypt credentials but never read them.
famweather-core.workspace = true
reqwest.workspace = true
rpassword.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
base64.workspace = true
# Tests decrypt what the binary encrypted, and use core::testdb.
famweather-core = { workspace = true, features = ["decrypt", "testdb", "test-support"] }
hex.workspace = true
hmac.workspace = true
sha2.workspace = true
tempfile.workspace = true
